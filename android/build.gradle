buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.progresshud'
    compileSdk safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 23)
        targetSdk safeExtGet('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    // Android 15 (API 35) 16KB page size support
    // This library is pure Java (no native code), so it's automatically compatible
    // with 16KB page sizes. No additional configuration needed.
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
}
